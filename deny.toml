# cargo-deny configuration for mosskeys-witness.
# Policy rationale: docs/threat-model.md T7 (supply chain).

[advisories]
version = 2
# Fail on any known vulnerability in the locked graph.
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
# Copyleft licenses are intentionally absent: this crate is MIT OR Apache-2.0
# and its dependency graph must stay compatible with that.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
