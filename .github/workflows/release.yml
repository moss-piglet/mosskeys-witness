name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  attestations: write
  id-token: write

# Prevent two simultaneous tag pushes from racing the publish steps.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Toolchain used to BUILD and PUBLISH the release. Intentionally newer than the
  # crate's declared MSRV (`rust-version = "1.85"`) so the release tooling
  # (cargo-audit, cargo-cyclonedx) installs cleanly — those tools raise their own
  # MSRV over time. MSRV compatibility is still verified in CI.
  RUST_TOOLCHAIN: "1.90"

jobs:
  # --- Fail-fast gates before any build/publish work ---
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Decouple from sibling working trees
        run: ./.github/scripts/decouple-from-siblings.sh

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Resolve sibling crates from crates.io
        run: cargo fetch

      # The release is triggered by a `v*` tag, but `cargo publish` reads the
      # version from Cargo.toml. If they disagree (e.g. the tag was pushed before
      # bumping Cargo.toml) the publish fails deep into the run. Fail fast here.
      - name: Verify Cargo.toml version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; pkgs=json.load(sys.stdin)["packages"]; print(next(p["version"] for p in pkgs if p["name"]=="mosskeys-witness"))')"
          echo "tag=${tag} Cargo.toml=${crate}"
          if [ "${tag}" != "${crate}" ]; then
            echo "::error::Tag v${tag} does not match Cargo.toml version ${crate}. Bump Cargo.toml (and Cargo.lock) before tagging."
            exit 1
          fi

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  # --- Cross-platform binary matrix ---
  build:
    needs: guard
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Decouple from sibling working trees
        shell: bash
        run: ./.github/scripts/decouple-from-siblings.sh

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Resolve sibling crates from crates.io
        shell: bash
        run: cargo fetch

      - name: Install cross linker
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        shell: bash
        env:
          # Point cargo at the cross linker for the linux aarch64 target. The
          # release profile (Cargo.toml) already strips the binary per-target, so
          # no separate `strip` step is needed here.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: cargo build --locked --release --target ${{ matrix.target }} --bin mosskeys-witness

      - name: Package (tar.gz)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="mosskeys-witness-${version}-${{ matrix.target }}"
          staging="${name}"
          mkdir -p "${staging}"
          cp "target/${{ matrix.target }}/release/mosskeys-witness" "${staging}/"
          cp README.md LICENSE-MIT LICENSE-APACHE config.example.toml "${staging}/" 2>/dev/null || true
          tar -czf "${name}.tar.gz" "${staging}"
          echo "ARTIFACT=${name}.tar.gz" >> "$GITHUB_ENV"

      # --- Cosign (keyless signing via GitHub OIDC) ---
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifact with cosign
        shell: bash
        run: cosign sign-blob --yes --bundle "${ARTIFACT}.cosign.bundle" "${ARTIFACT}"

      # --- Attestation (SLSA build provenance, per artifact) ---
      - name: Attest artifact
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.ARTIFACT }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.cosign.bundle
          if-no-files-found: error

  # --- Aggregate: SBOM + checksums + GitHub Release ---
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Decouple from sibling working trees
        run: ./.github/scripts/decouple-from-siblings.sh

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Resolve sibling crates from crates.io
        run: cargo fetch

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # --- SBOM (CycloneDX) ---
      # Generated from Cargo.lock so it reflects the exact dependency tree the
      # binaries were built from. CISA/NIST SSDF/EO 14028 reference CycloneDX.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: cargo cyclonedx --format json --override-filename sbom

      - name: Stage SBOM alongside artifacts
        run: |
          # cargo-cyclonedx writes per-crate SBOMs; publish the crate one.
          find . -name 'sbom*.json' -maxdepth 3 -print
          cp "$(find . -name 'sbom*.json' | head -n1)" dist/sbom.json

      # --- Cosign sign the SBOM too ---
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SBOM with cosign
        working-directory: dist
        run: cosign sign-blob --yes --bundle sbom.json.cosign.bundle sbom.json

      # --- Checksums (SHA-512, house standard) ---
      - name: Compute SHA-512 checksums
        working-directory: dist
        run: |
          sha512sum -- *.tar.gz sbom.json > SHA512SUMS
          cat SHA512SUMS

      # --- GitHub Release ---
      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.cosign.bundle
            dist/sbom.json
            dist/SHA512SUMS
          fail_on_unmatched_files: true

  # NOTE: the Homebrew `update-tap` job intentionally lands with the tap task
  # (mosskeys-witness (9): homebrew tap formula + install docs), which reuses
  # the signed tarballs this workflow produces.

  # --- Publish to crates.io (OIDC trusted publishing) ---
  publish:
    needs: build
    runs-on: ubuntu-latest
    # Scopes the crates.io OIDC trusted-publishing credential to a dedicated,
    # protectable environment (Settings → Environments). The trusted-publisher
    # config on crates.io must use this same environment name.
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Decouple from sibling working trees
        run: ./.github/scripts/decouple-from-siblings.sh

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Resolve sibling crates from crates.io
        run: cargo fetch

      # Freeze the decoupled manifest into an EPHEMERAL commit (never pushed) so
      # `cargo publish --locked` sees a clean working tree. This keeps the
      # uncommitted-changes guard active (no `--allow-dirty`): the deterministic
      # decouple + re-fetched Cargo.lock is what gets packaged and verified.
      - name: Freeze decoupled manifest (ephemeral, never pushed)
        run: |
          git -c user.name='mosskeys-release' \
              -c user.email='release@mosskeys.com' \
              commit -am 'ci: decouple sibling paths for crates.io publish'

      # Trusted publishing (OIDC): exchanges the workflow's short-lived GitHub
      # OIDC token for a temporary crates.io token. No long-lived
      # CARGO_REGISTRY_TOKEN secret is stored anywhere.
      # One-time setup: crates.io → crate Settings → Trusted Publishing.
      - name: Authenticate to crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-auth

      # Idempotent: crates.io publishes are immutable, so a resumed/re-run
      # release must not hard-fail just because the version is already on the
      # index.
      - name: Publish mosskeys-witness to crates.io
        run: |
          set +e
          out="$(cargo publish --locked 2>&1)"; code=$?
          echo "${out}"
          if [ "${code}" -ne 0 ]; then
            if echo "${out}" | grep -q "already exists on crates.io"; then
              echo "::warning::mosskeys-witness ${GITHUB_REF_NAME#v} is already on crates.io; skipping."
            else
              exit "${code}"
            fi
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
