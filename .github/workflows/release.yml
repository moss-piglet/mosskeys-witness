name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  attestations: write
  id-token: write

# Prevent two simultaneous tag pushes from racing the publish steps.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Toolchain used to BUILD and PUBLISH the release. Intentionally newer than the
  # crate's declared MSRV (`rust-version = "1.85"`) so the release tooling
  # (cargo-audit, cargo-cyclonedx) installs cleanly — those tools raise their own
  # MSRV over time. MSRV compatibility is still verified in CI.
  RUST_TOOLCHAIN: "1.90"

jobs:
  # --- Fail-fast gates before any build/publish work ---
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Decouple from sibling working trees
        run: ./.github/scripts/decouple-from-siblings.sh

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Resolve sibling crates from crates.io
        run: cargo fetch

      # The release is triggered by a `v*` tag, but `cargo publish` reads the
      # version from Cargo.toml. If they disagree (e.g. the tag was pushed before
      # bumping Cargo.toml) the publish fails deep into the run. Fail fast here.
      - name: Verify Cargo.toml version matches tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; pkgs=json.load(sys.stdin)["packages"]; print(next(p["version"] for p in pkgs if p["name"]=="mosskeys-witness"))')"
          echo "tag=${tag} Cargo.toml=${crate}"
          if [ "${tag}" != "${crate}" ]; then
            echo "::error::Tag v${tag} does not match Cargo.toml version ${crate}. Bump Cargo.toml (and Cargo.lock) before tagging."
            exit 1
          fi

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit

  # --- Cross-platform binary matrix ---
  build:
    needs: guard
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            apt: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
          # Static musl builds: the container image's runtime binaries (and the
          # answer for Alpine / minimal distros). Not referenced by the Homebrew
          # formula, which stays on the four gnu/darwin targets.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            apt: musl-tools
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            apt: gcc-aarch64-linux-gnu musl-tools
            linker: aarch64-linux-gnu-gcc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Decouple from sibling working trees
        shell: bash
        run: ./.github/scripts/decouple-from-siblings.sh

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ matrix.target }}

      - name: Resolve sibling crates from crates.io
        shell: bash
        run: cargo fetch

      - name: Install cross linker
        if: matrix.apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Build
        shell: bash
        env:
          # Point cargo at the cross linker for the linux aarch64 targets. The
          # release profile (Cargo.toml) already strips the binary per-target, so
          # no separate `strip` step is needed here.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.linker }}
          # ring (via ureq/rustls for `sync`) compiles C for the target; cc-rs
          # looks for aarch64-linux-musl-gcc, which Ubuntu's musl-tools does
          # not ship. The gnu gcc cross-compiles ring's freestanding C/asm for
          # aarch64 fine; the final link is still static musl (rustc's
          # self-contained musl std). x86_64-musl needs no help: cc-rs falls
          # back to musl-gcc, which musl-tools provides.
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
        run: cargo build --locked --release --target ${{ matrix.target }} --bin mosskeys-witness

      - name: Package (tar.gz)
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="mosskeys-witness-${version}-${{ matrix.target }}"
          staging="${name}"
          mkdir -p "${staging}"
          cp "target/${{ matrix.target }}/release/mosskeys-witness" "${staging}/"
          cp README.md LICENSE-MIT LICENSE-APACHE config.example.toml "${staging}/" 2>/dev/null || true
          tar -czf "${name}.tar.gz" "${staging}"
          echo "ARTIFACT=${name}.tar.gz" >> "$GITHUB_ENV"

      # --- Cosign (keyless signing via GitHub OIDC) ---
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign artifact with cosign
        shell: bash
        run: cosign sign-blob --yes --bundle "${ARTIFACT}.cosign.bundle" "${ARTIFACT}"

      # --- Attestation (SLSA build provenance, per artifact) ---
      - name: Attest artifact
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.ARTIFACT }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.cosign.bundle
          if-no-files-found: error

  # --- Aggregate: SBOM + checksums + GitHub Release ---
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Decouple from sibling working trees
        run: ./.github/scripts/decouple-from-siblings.sh

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Resolve sibling crates from crates.io
        run: cargo fetch

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # --- SBOM (CycloneDX) ---
      # Generated from Cargo.lock so it reflects the exact dependency tree the
      # binaries were built from. CISA/NIST SSDF/EO 14028 reference CycloneDX.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked

      - name: Generate SBOM
        run: cargo cyclonedx --format json --override-filename sbom

      - name: Stage SBOM alongside artifacts
        run: |
          # cargo-cyclonedx writes per-crate SBOMs; publish the crate one.
          find . -name 'sbom*.json' -maxdepth 3 -print
          cp "$(find . -name 'sbom*.json' | head -n1)" dist/sbom.json

      # --- Cosign sign the SBOM too ---
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign SBOM with cosign
        working-directory: dist
        run: cosign sign-blob --yes --bundle sbom.json.cosign.bundle sbom.json

      # --- Checksums (SHA-512, house standard) ---
      - name: Compute SHA-512 checksums
        working-directory: dist
        run: |
          sha512sum -- *.tar.gz sbom.json > SHA512SUMS
          cat SHA512SUMS

      # --- GitHub Release ---
      - name: Attach artifacts to GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.cosign.bundle
            dist/sbom.json
            dist/SHA512SUMS
          fail_on_unmatched_files: true

  # --- Container image (GHCR, multi-arch, FROM scratch) ---
  # Publishes ghcr.io/moss-piglet/mosskeys-witness:<version> and :latest.
  # The image is built FROM scratch directly from the two static musl
  # binaries above — no shell, no package manager, no CA bundle (the witness
  # only SERVES: it never initiates outbound TLS, so there are no client
  # roots to ship — see Dockerfile and docs/threat-model.md). The pushed
  # multi-arch index digest is cosign-signed keyless with the same GitHub
  # Actions OIDC identity as the per-artifact blob signatures.
  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout the Dockerfile
      packages: write # push to GHCR
      id-token: write # cosign keyless
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download musl build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-unknown-linux-musl"
          path: artifacts

      # Stage the binaries at dist/linux-<docker arch>/mosskeys-witness; the
      # Dockerfile selects the right one via buildx's TARGETARCH arg.
      - name: Stage per-arch binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
          for pair in "x86_64:amd64" "aarch64:arm64"; do
            rust_arch="${pair%%:*}"
            docker_arch="${pair##*:}"
            target="${rust_arch}-unknown-linux-musl"
            mkdir -p "dist/linux-${docker_arch}"
            tar -xzf "artifacts/${target}/mosskeys-witness-${version}-${target}.tar.gz" \
              --strip-components=1 -C "dist/linux-${docker_arch}" \
              "mosskeys-witness-${version}-${target}/mosskeys-witness"
            chmod 0755 "dist/linux-${docker_arch}/mosskeys-witness"
          done
          ls -l dist/linux-*/mosskeys-witness

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # FROM scratch + COPY only: no RUN steps, so no QEMU emulation needed
      # to build the foreign-arch variant. buildx provenance attestations
      # (default, mode=min) ride along on the index for free.
      - name: Build and push multi-arch image
        id: build-image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/moss-piglet/mosskeys-witness:${{ env.VERSION }}
            ghcr.io/moss-piglet/mosskeys-witness:latest

      # Sign the multi-arch INDEX digest: one signature covers both archs,
      # keyless under the same release-workflow identity as sign-blob.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digest with cosign
        run: cosign sign --yes "ghcr.io/moss-piglet/mosskeys-witness@${{ steps.build-image.outputs.digest }}"

  # --- Update the Homebrew tap formula ---
  # Runs after the GitHub Release exists (so the tarball URLs resolve) and
  # regenerates Formula/mosskeys-witness.rb in the tap repo, pointing at the
  # freshly published, signed release tarballs. The formula installs the
  # PREBUILT binary (not a from-source build), reusing the exact signed
  # artifact.
  #
  # SUPPLY-CHAIN NOTE: `brew install` trusts only the formula's url + sha256, so
  # write access to the tap repo is release-critical. This job authenticates with
  # a SHORT-LIVED GitHub App installation token (auto-expires ~1h, scoped to the
  # single tap repo), minted at runtime from an App private key. No long-lived
  # cross-repo PAT is stored anywhere. The App credentials live in the protected
  # `release` environment, so only this tag-triggered job (inheriting the
  # environment's review/branch controls) can mint a token.
  #
  # One-time setup (see RELEASING.md):
  #   - Create the tap repo: moss-piglet/homebrew-mosskeys-witness (with Formula/).
  #   - Register a GitHub App with contents:write, install it on ONLY the tap repo.
  #   - Add the `release` environment secrets HOMEBREW_TAP_APP_ID and
  #     HOMEBREW_TAP_APP_PRIVATE_KEY.
  #   - Add the App as a bypass actor on the tap's `main` ruleset so this push
  #     succeeds while human pushes still require a reviewed PR.
  update-tap:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout mosskeys-witness (for the render script)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Download release tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Render Homebrew formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p rendered
          ./.github/scripts/render-homebrew-formula.sh "${version}" dist > rendered/mosskeys-witness.rb
          cat rendered/mosskeys-witness.rb

      # Mint a short-lived installation token scoped to ONLY the tap repo. The
      # token expires ~1h after issue, so a leaked runner log cannot be replayed
      # into a durable cross-repo write credential.
      - name: Mint tap-repo App token
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: moss-piglet
          repositories: homebrew-mosskeys-witness

      - name: Checkout tap repo
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: moss-piglet/homebrew-mosskeys-witness
          token: ${{ steps.tap-token.outputs.token }}
          path: tap

      - name: Commit and push updated formula
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p tap/Formula
          cp rendered/mosskeys-witness.rb tap/Formula/mosskeys-witness.rb
          cd tap
          if git diff --quiet -- Formula/mosskeys-witness.rb; then
            echo "::notice::formula already up to date for v${version}; nothing to push."
            exit 0
          fi
          git -c user.name='mosskeys-release[bot]' \
              -c user.email='mosskeys-release[bot]@users.noreply.github.com' \
              commit -am "mosskeys-witness ${version}"
          git push

  # --- Publish to crates.io (OIDC trusted publishing) ---
  publish:
    needs: build
    runs-on: ubuntu-latest
    # Scopes the crates.io OIDC trusted-publishing credential to a dedicated,
    # protectable environment (Settings → Environments). The trusted-publisher
    # config on crates.io must use this same environment name.
    environment: release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Decouple from sibling working trees
        run: ./.github/scripts/decouple-from-siblings.sh

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Resolve sibling crates from crates.io
        run: cargo fetch

      # Freeze the decoupled manifest into an EPHEMERAL commit (never pushed) so
      # `cargo publish --locked` sees a clean working tree. This keeps the
      # uncommitted-changes guard active (no `--allow-dirty`): the deterministic
      # decouple + re-fetched Cargo.lock is what gets packaged and verified.
      - name: Freeze decoupled manifest (ephemeral, never pushed)
        run: |
          git -c user.name='mosskeys-release' \
              -c user.email='release@mosskeys.com' \
              commit -am 'ci: decouple sibling paths for crates.io publish'

      # Trusted publishing (OIDC): exchanges the workflow's short-lived GitHub
      # OIDC token for a temporary crates.io token. No long-lived
      # CARGO_REGISTRY_TOKEN secret is stored anywhere.
      # One-time setup: crates.io → crate Settings → Trusted Publishing.
      - name: Authenticate to crates.io (OIDC)
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-auth

      # Idempotent: crates.io publishes are immutable, so a resumed/re-run
      # release must not hard-fail just because the version is already on the
      # index.
      - name: Publish mosskeys-witness to crates.io
        run: |
          set +e
          out="$(cargo publish --locked 2>&1)"; code=$?
          echo "${out}"
          if [ "${code}" -ne 0 ]; then
            if echo "${out}" | grep -q "already exists on crates.io"; then
              echo "::warning::mosskeys-witness ${GITHUB_REF_NAME#v} is already on crates.io; skipping."
            else
              exit "${code}"
            fi
          fi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
