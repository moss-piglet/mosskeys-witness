# mosskeys-witness example configuration.
#
# Copy to /etc/mosskeys-witness/witness.toml (or anywhere) and pass to:
#   mosskeys-witness run --config /path/to/witness.toml
#
# Every setting is validated at startup and any error is fatal (fail closed):
# unknown fields, duplicate origins, unparsable vkeys, insecure key files.

# Witness key name — must be the name `mosskeys-witness keygen --name` minted
# the seed files for. Embedded in every cosignature and vkey. The name's path
# component ("/w1" below) is also the HTTP API prefix: the witness serves
# POST <prefix>/add-checkpoint and GET <prefix>/<origin hash>/checkpoint under
# it AND at the listener root, so a registered submission prefix of
# "https://<name>" reaches the API either way. A host-only name serves at the
# root only. The path must be a plain static URL path (no empty segments, no
# `{`/`}`/`*` router syntax) — anything else is a fatal startup error.
name = "witness.example/w1"

# Socket the HTTP service binds. The submission prefix (POST /add-checkpoint)
# and the monitoring prefix (GET /<origin hash>/checkpoint) share this one
# listener (GI-04).
listen = "0.0.0.0:8080"

# Append-only state file: one JSON record per cosigned checkpoint, fsynced
# before every 200 response. Exclusive-locked while running; a second
# instance on the same file fails fast. Back it up — losing it never causes
# mis-cosigning, but every log must re-sync via the 409 flow.
state_file = "/var/lib/mosskeys-witness/state.jsonl"

# The two independently minted cosigner seeds (KEEP SECRET, mode 0600 — the
# witness refuses to start on group/world-readable key files). Mint with:
#   mosskeys-witness keygen --name witness.example/w1 --out-dir ./keys
[keys]
ed25519_seed = "/etc/mosskeys-witness/keys/ed25519.seed"
mldsa44_seed = "/etc/mosskeys-witness/keys/mldsa44.seed"

# Optional: keep the origin allowlist current without hand-edits. With the
# [discovery] section present, `run` polls the deployment's log-discovery
# feed itself — the first poll runs at boot (without blocking startup), then
# every interval_secs (default 300, shown below) — validates every entry with
# the same fail-closed rules as this file, atomically updates
# discovered_logs.toml next to the state file, and HOT-SWAPS the in-memory
# allowlist: new origins are cosigned within one interval, with no restart
# and no operator action. Poll failures (feed down, invalid response) are
# logged and non-fatal — the last known set keeps serving. Polls are
# ETag-conditional, so an unchanged feed costs a 304.
#
# Trust posture: the pinned (HTTPS) feed URL is the vetting boundary for
# managed entries — a vkey change served by the feed is applied at the next
# poll. Pin an origin's keys by keeping a manual [[log]] stanza for it;
# manual stanzas always win over managed entries for the same origin.
# [discovery]
# feed_url = "https://mosskeys.com/api/witness/logs"
# interval_secs = 300
#
# Prefer restart-based updates instead? Omit the section and cron the
# one-shot subcommand (same fetch/validate/write path; exit 0 = unchanged,
# 10 = updated, 1 = error), certbot-style:
#
#   */15 * * * * root mosskeys-witness sync --quiet --config /etc/mosskeys-witness/witness.toml; [ $? -eq 10 ] && systemctl restart mosskeys-witness

# One [[log]] stanza per cosigned log. Unknown origins are 404 by
# construction; duplicate origins are a fatal startup error. With `sync`
# managing the set you may omit every stanza — the witness refuses to start
# only if the EFFECTIVE allowlist (manual + managed) is empty.
#
# vkeys: the log's signed-note verifier key(s) — the public line(s) the log
# operator publishes (Ed25519 0x01, hybrid, ...). A checkpoint must carry at
# least one signature from one of these keys to be considered at all.
[[log]]
origin = "example.com/behind-the-sofa"
vkeys = [
    "example.com/behind-the-sofa+1a2b3c4d+ARoSSZxPlaceholderReplaceMeWithTheLogsVkey=",
]

# A second log (note: origins must be exact — no wildcards, no prefixes):
# [[log]]
# origin = "sigsum.org/restricted-dev/2025"
# vkeys = ["sigsum.org/restricted-dev/2025+deadbeef+AQ..."]
