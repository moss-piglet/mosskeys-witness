[package]
name = "mosskeys-witness"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "Post-quantum-native C2SP tlog-witness: dual-signs transparency log checkpoints with Ed25519 (0x04) and ML-DSA-44 (0x06) cosignatures, built on the audited metamorphic-log crate."
license = "MIT OR Apache-2.0"
repository = "https://github.com/moss-piglet/mosskeys-witness"
homepage = "https://mosskeys.com"
keywords = ["transparency-log", "witness", "post-quantum", "ml-dsa-44", "c2sp"]
categories = ["cryptography", "network-programming"]
readme = "README.md"

[dependencies]
# The audited transparency-log + cosignature stack. Local co-development
# resolves the sibling working tree (`../metamorphic-log`); CI and releases
# strip the `path` key via .github/scripts/decouple-from-siblings.sh and
# resolve the pinned version from crates.io.
metamorphic-log = { version = "=0.5.0", path = "../metamorphic-log" }
# Single source of truth for cryptographic primitives (keypair generation).
# Pure crates.io dependency: metamorphic-log resolves the same registry
# version, so there is exactly ONE crypto core in the graph.
metamorphic-crypto = "=0.11.0"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
base64 = "0.22"
thiserror = "2"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
toml = "0.8"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["timeout"] }
# Hot-swappable origin allowlist for the [discovery] poller. Justification
# for the one new dependency: std RwLock would poison permanently if any
# lock-holder panicked (a single panicking request would 500 the witness
# forever — the opposite of fail-operational), and avoiding that needs
# poison-recovery discipline at every call site, forever. ArcSwap has no
# poisoning mode at all: wait-free atomic loads on the request path, one
# atomic whole-map replace per poll, and a poll-loop panic always leaves the
# last good allowlist serving. Zero transitive deps; MIT OR Apache-2.0.
arc-swap = "1"
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server", "server-auto", "tokio"] }
# Blocking HTTP client, used ONLY by the `sync` subcommand's discovery-feed
# fetch — never linked into the `run` serving path's request handling. rustls
# with embedded webpki roots: TLS verification needs no system CA bundle, so
# `sync` works inside the FROM-scratch container image too.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
# Long-running network daemon: optimize for throughput, keep unwinding so a
# panicking request task cannot take down the witness (see docs/threat-model.md
# T5). No panic = "abort" here on purpose.
lto = true
codegen-units = 1
strip = true
